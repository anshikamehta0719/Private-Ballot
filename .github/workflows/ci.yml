name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install



      - name: Run test suite
        run: npm test

      - name: Build dApp
        run: npm run build

      - name: Upload managed contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-contract
          path: managed/
          retention-days: 7
